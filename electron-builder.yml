appId: dev.uvarov.minigcs
productName: Mini GCS
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
mac:
  category: public.app-category.utilities
  target:
    - dmg
  # Signing is intentionally off (CSC_LINK / CSC_KEY_PASSWORD unset).
  identity: null
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Utility
